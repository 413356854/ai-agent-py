[project]
name = "ai-agent-py"
version = "0.1.0"
description = "RAG + LangGraph agent playground (LangChain / LangGraph / uv)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "ai-agent-py" }]
keywords = ["rag", "langchain", "langgraph", "llm", "agent"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    # --- LangChain / LangGraph stack -------------------------------------
    "langchain>=0.3,<2",
    "langchain-core>=0.3,<2",
    "langchain-text-splitters>=0.3,<2",
    "langchain-openai>=0.2,<2",
    "langchain-chroma>=0.1,<2",
    "langgraph>=0.2,<2",
    # --- app plumbing ----------------------------------------------------
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    # --- document loaders ------------------------------------------------
    "pypdf>=4.2",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",  # HTMLHeaderTextSplitter 解析 h1~h4
    # --- http api --------------------------------------------------------
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.33",
    # --- MySQL（文档解析任务记录 tb_document_parse_job）-------------------
    "sqlalchemy>=2.0,<3",
    "pymysql>=1.1,<2",
    "cryptography>=42",
    # --- Milvus（切分后写入 db_tax_rag.rag_chunk）-------------------------
    "pymilvus>=2.5,<3",
    "openpyxl>=3.1.5",
]

[project.scripts]
ai-agent-py = "ai_agent_py.cli:app"

[project.urls]
Homepage = "https://github.com/example/ai-agent-py"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true
default-groups = ["dev"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# RUF001-003 flag full-width CJK punctuation, which this project uses on purpose.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["ai_agent_py", "conftest", "fakes"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
